<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d3a">
  <meta name="description" content="Straw Hat Showdown: an unofficial One Piece fan fighting game for phones.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Showdown">
  <title>Straw Hat Showdown</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="bg" width="960" height="540"></canvas>
    <canvas id="game" width="960" height="540"></canvas>
    <div id="ui"></div>
  </div>
  <div id="controls" hidden></div>
  <div id="rotate" aria-live="polite">
    <div class="rotate-phone"></div>
    <p>Rotate your phone</p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
