<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Games</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff8e7; --ink: #1b1b1b; --card: #ffffff; --accent: #e8322b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1d3a; --ink: #fff8e7; --card: #13294d; } }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 32px; }
    p { margin: 0 0 24px; opacity: .8; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a { display: block; padding: 16px 20px; border-radius: 14px; background: var(--card); color: inherit;
        text-decoration: none; border-left: 6px solid var(--accent); box-shadow: 0 2px 8px rgb(0 0 0 / .12); }
    a strong { display: block; font-size: 20px; }
    a span { font-size: 15px; opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Web Games</h1>
    <p>Simple games for kids. They play in the browser, best on a phone.</p>
    <ul>
      <li>
        <a href="straw-hat-showdown/">
          <strong>Straw Hat Showdown</strong>
          <span>One-on-one fighting game with Luffy, Zoro, Sanji and Nami. Hold your phone sideways. Unofficial fan game.</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
